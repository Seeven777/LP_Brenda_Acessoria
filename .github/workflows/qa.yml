name: Landing Page QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start static web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brenda-qa-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Test desktop and mobile interactions
        run: node tests/smoke.mjs
      - name: Test all functionality pages
        run: node tests/features.mjs
      - name: Check external video covers (diagnostic only)
        run: node tests/media-preview.mjs
        continue-on-error: true
        timeout-minutes: 2
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brenda-qa-screenshots
          path: tests/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
